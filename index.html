<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Glasses OS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: white;
    }

    /* Live Camera Background Passthrough */
    #camera-feed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 70% Viewport Container (Lens Safe Zone) */
    .vr-safe-zone {
      position: relative;
      z-index: 2;
      width: 70vw;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 10px;
    }

    /* Dynamic Island Top Bar */
    .dynamic-island {
      position: relative;
      z-index: 100;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      margin-bottom: 15px;
    }

    .island-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn:active {
      background: rgba(255, 255, 255, 0.5);
    }

    #undo-btn { display: none; }

    /* App Grid Container */
    .app-grid-container {
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .app-grid-container::-webkit-scrollbar { display: none; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 15px;
      width: 100%;
      padding: 10px 0;
    }

    .app-icon {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .app-icon:active {
      transform: scale(0.92);
    }

    .icon-box {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.3);
      overflow: hidden;
    }

    .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 2px;
    }

    .app-label {
      font-size: 11px;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      text-align: center;
      max-width: 70px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Active Window Overlay */
    .app-window {
      width: 100%;
      height: 75vh;
      background: rgba(15, 15, 20, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      overflow: hidden;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Add Custom App Modal */
    .modal {
      position: absolute;
      top: 90px;
      width: 100%;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      z-index: 110;
    }

    .modal h3 {
      font-size: 16px;
      text-align: center;
    }

    .modal input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 13px;
      outline: none;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit { background: #34c759; color: white; }
    .btn-cancel { background: #ff3b30; color: white; }
  </style>
</head>

    </div>

    <div class="app-window" id="app-window">
      <iframe id="app-frame" src="about:blank"></iframe>
    </div>

    <div class="modal" id="add-modal">
      <h3>Add Shortcut</h3>
      <input type="text" id="app-name" placeholder="Name (e.g., Twitch)">

    }

    async function getTurnByTurnRoute(startLat, startLng, endLat, endLng, destinationName) {
      const url = \`https://router.project-osrm.org/route/v1/driving/\${startLng},\${startLat};\${endLng},\${endLat}?steps=true&geometries=geojson\`;
      try {
        const res = await fetch(url);
        const routeData = await res.json();

        if (routeData.routes && routeData.routes.length > 0) {
          const route = routeData.routes[0];
          
          if (routeLine) map.removeLayer(routeLine);
          const coordinates = route.geometry.coordinates.map(c => [c[1], c[0]]);
          routeLine = L.polyline(coordinates, { color: '#34c759', weight: 5, opacity: 0.9 }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });

          navSteps = [];
          route.legs[0].steps.forEach(s => {
            navSteps.push({
              instruction: s.maneuver.type === 'arrive' ? \`Arrived at \${destinationName}\` : (s.name ? \`Turn onto \${s.name}\` : 'Head towards destination'),
              type: s.maneuver.type,
              modifier: s.maneuver.modifier,
              distance: Math.round(s.distance * 3.28084),
              duration: Math.round(route.duration / 60)
            });
          });

          currentStepIdx = 0;
          showStepInHUD(destinationName);
        }
      } catch (e) {
        navSteps = [{ instruction: \`Heading to \${destinationName}\`, type: 'straight', distance: 500, duration: 5 }];
        currentStepIdx = 0;
        showStepInHUD(destinationName);
      }
    }

    function showStepInHUD(destName) {
      if (navSteps.length === 0) return;
      const step = navSteps[currentStepIdx];
      
      let icon = '⬆️';
      if (step.modifier?.includes('right')) icon = '↗️';
      else if (step.modifier?.includes('left')) icon = '↖️';
      else if (step.type === 'arrive') icon = '📍';

      document.getElementById('hud-turn-icon').innerText = icon;
      document.getElementById('hud-instruction').innerText = step.instruction;
      document.getElementById('hud-sub').innerText = step.type === 'arrive' ? 'Destination Reached' : \`In \${step.distance} ft • \${step.duration} min to \${destName}\`;
      
      document.getElementById('meta-nav-card').classList.add('active');
    }

    function nextStep() {
      currentStepIdx++;
      if (currentStepIdx < navSteps.length) {
        showStepInHUD('Destination');
      } else {
        cancelNav();
      }
    }

    function cancelNav() {
      document.getElementById('meta-nav-card').classList.remove('active');
      if (routeLine) map.removeLayer(routeLine);
      if (searchMarker) map.removeLayer(searchMarker);
    }

    window.onload = initMap;
  <\/script>
</body>
</html>`;
