      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: white;
    }

    #camera-feed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    .vr-safe-zone {
      position: relative;
      z-index: 2;
      width: 70vw;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 10px;
    }

    .dynamic-island {
      position: relative;
      z-index: 100;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      margin-bottom: 15px;
    }

    .island-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn:active {
      background: rgba(255, 255, 255, 0.5);
    }

    #undo-btn { display: none; }

    .app-grid-container {
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .app-grid-container::-webkit-scrollbar { display: none; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 15px;
      width: 100%;
      padding: 10px 0;
    }

    .app-icon {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .app-icon:active {
      transform: scale(0.92);
    }

    .icon-box {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.3);
      overflow: hidden;
      font-size: 28px;
    }

    .app-label {
      font-size: 11px;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      text-align: center;
      max-width: 70px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .app-window {
      width: 100%;
      height: 75vh;
      background: rgba(15, 15, 20, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      overflow: hidden;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .modal {
      position: absolute;
      top: 90px;
      width: 100%;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      z-index: 110;
    }

    .modal h3 { font-size: 16px; text-align: center; }

    .modal input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 13px;
      outline: none;
    }

    .modal-buttons { display: flex; gap: 10px; margin-top: 5px; }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit { background: #34c759; color: white; }
    .btn-cancel { background: #ff3b30; color: white; }
  </style>
</head>

      <button class="action-btn" id="add-btn" onclick="openModal()">+ Add</button>
      <button class="action-btn" id="undo-btn" onclick="closeApp()">↩ Back</button>

    <div class="app-grid-container" id="grid-container">

    // Register PWA Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration failed', err));
    }

    function openExternalMessenger(scheme, name) {
      // 1. Send system notification via Service Worker
      if ('serviceWorker' in navigator && navigator.serviceWorker.controller) {
        navigator.serviceWorker.ready.then(registration => {
          registration.showNotification(`RETURN TO AR OS`, {
            body: ` Tap here to jump back from ${name}`,
            icon: "https://fav.farm/👓",
            badge: "https://fav.farm/👓",
            vibrate: [200, 100, 200],
            tag: "ar-app-switch"
          });
        });
      }

      // 2. Display large on-screen HUD banner
      showLargeReturnBanner(name);

      // 3. Launch native application
      setTimeout(() => {
        window.location.href = scheme;
      }, 350);
    }

    function showLargeReturnBanner(appName) {
      let banner = document.getElementById('ar-return-hud');
      
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'ar-return-hud';
        banner.style.cssText = `
          position: fixed;
          top: 20px;
          left: 5%;
          width: 90%;
          padding: 18px 20px;
          background: rgba(20, 20, 30, 0.95);
          border: 2px solid #34c759;
          border-radius: 20px;
          color: white;
          z-index: 99999;
          display: flex;
          align-items: center;
          justify-content: space-between;
          box-shadow: 0 10px 30px rgba(0,0,0,0.8);
          backdrop-filter: blur(20px);
          -webkit-backdrop-filter: blur(20px);
          cursor: pointer;
        `;
        document.body.appendChild(banner);
      }

      banner.innerHTML = `
        <div style="display:flex; align-items:center; gap:12px;">
          <span style="font-size:28px;">📱</span>
          <div>
            <div style="font-size:16px; font-weight:bold;">Opened ${appName}</div>
            <div style="font-size:12px; color:#aaa;">Tap anywhere to switch back</div>
          </div>
        </div>
        <button style="background:#34c759; border:none; color:black; font-weight:bold; padding:10px 16px; border-radius:12px; font-size:14px;">Return</button>
      `;

      banner.onclick = () => {
        banner.style.display = 'none';
        window.focus();
      };

      banner.style.display = 'flex';
    }

<script>
const GEMINI_API_KEY = "AIzaSyC7Mdu-brt_LdYmAW8N1HgQ5BaNBRx4488";

function saveCreatorsToStorage() { localStorage.setItem("jewtube_creators", JSON.stringify(creators)); }

async function addCreatorWithGemini() {
    const promptText = prompt("Ask Gemini for creators:");
    if (!promptText) return;
    const addBtn = document.getElementById("add-btn");
    addBtn.innerText = "Searching..."; addBtn.disabled = true;
    const geminiUrl = \`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=\${GEMINI_API_KEY}\`;
    try {
        let suggestedChannels = [];
        const geminiRes = await fetch(geminiUrl, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: \`If "\${promptText}" is a creator, return JSON: [{"name": "Channel Name"}]\` }] }], generationConfig: { responseMimeType: "application/json" } })
        });
        const geminiData = await geminiRes.json();
        if (!geminiRes.ok) { suggestedChannels = [{ name: promptText }]; } 
        else { suggestedChannels = JSON.parse(geminiData.candidates?.[0]?.content?.parts?.[0]?.text || "[]"); }
        if (suggestedChannels.length === 0) suggestedChannels = [{ name: promptText }];
        for (const item of suggestedChannels) {
            const name = item.name || item.channelName;
            if (name) {
                const ytChannel = await searchYouTubeChannel(name);
                if (ytChannel) { addChannelToState(ytChannel); break; }
            }
        }
    } catch (err) {
        const fallbackChannel = await searchYouTubeChannel(promptText);
        if (fallbackChannel) addChannelToState(fallbackChannel);
        else alert("Error finding channel.");
    } finally {
        addBtn.innerText = "+ Add Creator with Gemini"; addBtn.disabled = false;
    }
}

async function searchYouTubeChannel(channelName) {
    const ytUrl = \`https://www.googleapis.com/youtube/v3/search?part=snippet&type=channel&q=\${encodeURIComponent(channelName)}&key=\${YT_API_KEY}\`;
    try {
        const res = await fetch(ytUrl);
        const data = await res.json();
        if (res.ok && data.items?.length > 0) {
            return { name: data.items[0].snippet.channelTitle, channelId: data.items[0].snippet.channelId };
        }
    } catch (err) {}
    return null;
}

function addChannelToState(channel) {
    if (!creators.some(c => c.channelId === channel.channelId)) {
        creators.push(channel); saveCreatorsToStorage(); renderCreatorChips(); fetchAllVideos();
    } else { alert(\`\${channel.name} is already added!\`); }
}

async function fetchAllVideos() {
    if (creators.length === 0) { updateStatus("No creators added. Click '+ Add Creator with Gemini'."); return; }
    updateStatus("Updating feeds...");
    let fetchedItems = [];
    for (const creator of creators) {
        const uploadsPlaylistId = creator.channelId.replace(/^UC/, "UU");
        const url = \`https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&playlistId=\${uploadsPlaylistId}&maxResults=10&key=\${YT_API_KEY}\`;
        try {
            const res = await fetch(url); const data = await res.json();
            if (res.ok && data.items) {
                data.items.forEach(item => {
                    fetchedItems.push({
                        title: item.snippet.title, videoId: item.snippet.resourceId.videoId,
                        channelId: creator.channelId, channelTitle: creator.name,
                        publishedAt: item.snippet.publishedAt, thumbnail: item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url
                    });
                });
            }
        } catch (e) {}
    }
    fetchedItems.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));
    allVideos = fetchedItems; updateStatus("Feed updated."); applyFilters();
}

function renderCreatorChips() {
    const list = document.getElementById('creator-chips-list');
    list.innerHTML = creators.map(c => \`<button class="chip-btn \${currentFilter === c.channelId ? 'active-chip' : ''}" onclick="filterByCreator('\${c.channelId}')">\${c.name}</button>\`).join('');
}

function filterByCreator(channelId) {
    currentFilter = channelId; applyFilters();
}

function applyFilters() {
    let filteredVideos = currentFilter === 'all' ? allVideos : allVideos.filter(v => v.channelId === currentFilter);
    renderVideoGrid(filteredVideos);
}

function renderVideoGrid(videos) {
    const container = document.getElementById('videos-results');
    if (videos.length === 0) { container.innerHTML = "<div style='grid-column: 1/-1; text-align:center;'>No videos found.</div>"; return; }
    container.innerHTML = videos.map(item => {
        const safeTitle = item.title.replace(/'/g, "\\'");

                <a href="javascript:void(0)" onclick="openVideoPlayer('\${item.videoId}', '\${safeTitle}')">\${item.title}</a>
                <small><strong>\${item.channelTitle}</strong></small>
            </div>
        </div>\`;
    }).join('');
}

function openVideoPlayer(videoId, title) {
    document.getElementById('videos-grid-wrapper').style.display = 'none';
    document.getElementById('video-embed-view').style.display = 'block';
    document.getElementById('playing-video-title').textContent = title;

}

    if (mainPlayer && typeof mainPlayer.stopVideo === 'function') mainPlayer.stopVideo();
    document.getElementById('videos-grid-wrapper').style.display = 'block';
    document.getElementById('video-embed-view').style.display = 'none';
}

function updateStatus(msg) { document.getElementById('status-msg').textContent = msg; }
window.addEventListener('DOMContentLoaded', () => { renderCreatorChips(); if (creators.length > 0) fetchAllVideos(); });
<\/script>

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([defaultLat, defaultLng], 14);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap © CARTO'
      }).addTo(map);

      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
          defaultLat = pos.coords.latitude;
          defaultLng = pos.coords.longitude;
          map.setView([defaultLat, defaultLng], 15);
          addUserMarker(defaultLat, defaultLng);
        }, () => addUserMarker(defaultLat, defaultLng));
      } else {
        addUserMarker(defaultLat, defaultLng);
      }
    }

    function addUserMarker(lat, lng) {
      if (userMarker) map.removeLayer(userMarker);
      const userIcon = L.divIcon({
        className: 'custom-user-pin',
        html: '<div style="width:18px;height:18px;background:#007aff;border:3px solid white;border-radius:50%;box-shadow:0 0 12px #007aff;"></div>'
      });
      userMarker = L.marker([lat, lng], { icon: userIcon }).addTo(map);
    }

    async function searchLocation(queryOverride) {
      const query = queryOverride || document.getElementById('map-search-input').value.trim();
      if (!query) return;

      try {
        const res = await fetch(\`https://nominatim.openstreetmap.org/search?format=json&q=\${encodeURIComponent(query)}&lat=\${defaultLat}&lon=\${defaultLng}\`);
        const data = await res.json();

        if (data && data.length > 0) {
          const destLat = parseFloat(data[0].lat);
          const destLng = parseFloat(data[0].lon);

          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.marker([destLat, destLng]).addTo(map).bindPopup(data[0].display_name).openPopup();

          await getTurnByTurnRoute(defaultLat, defaultLng, destLat, destLng, data[0].display_name.split(',')[0]);
        }
      } catch (err) { console.error("Navigation error", err); }
    }

    async function getTurnByTurnRoute(startLat, startLng, endLat, endLng, destinationName) {
      const url = \`https://router.project-osrm.org/route/v1/driving/\${startLng},\${startLat};\${endLng},\${endLat}?steps=true&geometries=geojson\`;
      try {
        const res = await fetch(url);
        const routeData = await res.json();

        if (routeData.routes && routeData.routes.length > 0) {
          const route = routeData.routes[0];
          
          if (routeLine) map.removeLayer(routeLine);
          const coordinates = route.geometry.coordinates.map(c => [c[1], c[0]]);
          routeLine = L.polyline(coordinates, { color: '#34c759', weight: 5, opacity: 0.9 }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });

          navSteps = [];
          route.legs[0].steps.forEach(s => {
            navSteps.push({
              instruction: s.maneuver.type === 'arrive' ? \`Arrived at \${destinationName}\` : (s.name ? \`Turn onto \${s.name}\` : 'Head towards destination'),
              type: s.maneuver.type,
              modifier: s.maneuver.modifier,
              distance: Math.round(s.distance * 3.28084),
              duration: Math.round(route.duration / 60)
            });
          });

          currentStepIdx = 0;
          showStepInHUD(destinationName);
        }
      } catch (e) {
        navSteps = [{ instruction: \`Heading to \${destinationName}\`, type: 'straight', distance: 500, duration: 5 }];
        currentStepIdx = 0;
        showStepInHUD(destinationName);
      }
    }

    function showStepInHUD(destName) {
      if (navSteps.length === 0) return;
      const step = navSteps[currentStepIdx];
      
      let icon = '⬆️';
      if (step.modifier?.includes('right')) icon = '↗️';
      else if (step.modifier?.includes('left')) icon = '↖️';
      else if (step.type === 'arrive') icon = '📍';

      document.getElementById('hud-turn-icon').innerText = icon;
      document.getElementById('hud-instruction').innerText = step.instruction;
      document.getElementById('hud-sub').innerText = step.type === 'arrive' ? 'Destination Reached' : \`In \${step.distance} ft • \${step.duration} min to \${destName}\`;
      
      document.getElementById('meta-nav-card').classList.add('active');
    }

    function nextStep() {
      currentStepIdx++;
      if (currentStepIdx < navSteps.length) { showStepInHUD('Destination'); } 
      else { cancelNav(); }
    }

    function cancelNav() {
      document.getElementById('meta-nav-card').classList.remove('active');
      if (routeLine) map.removeLayer(routeLine);
      if (searchMarker) map.removeLayer(searchMarker);
    }

    window.onload = initMap;
  <\/script>
</body>
</html>`;

    const cameraAppCode = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Camera</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; color: white; }
    #cam-preview { width: 100%; height: 100%; object-fit: cover; }
    
    .hud-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: 16px; pointer-events: none;
    }

    .cam-status {
      align-self: center; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
      padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: bold;
      display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.2);
    }

    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff3b30; }
    .rec-dot.active { animation: blink 1s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .cam-controls {
      display: flex; justify-space-around; align-items: center;
      padding-bottom: 10px; pointer-events: auto;
    }

    .shutter-btn {
      width: 60px; height: 60px; border-radius: 50%; border: 4px solid white;
      background: transparent; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    .shutter-inner {
      width: 44px; height: 44px; border-radius: 50%; background: #ff3b30;
      transition: all 0.2s ease;
    }

    .shutter-btn.recording .shutter-inner {
      width: 24px; height: 24px; border-radius: 6px; background: #ff3b30;
    }

    .snap-btn {
      background: rgba(255,255,255,0.25); border: none; color: white;
      padding: 10px 18px; border-radius: 12px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <video id="cam-preview" autoplay playsinline muted></video>

  <div class="hud-overlay">
    <div class="cam-status">
      <div class="rec-dot" id="rec-indicator"></div>
      <span id="timer-label">POV Mode • Ready</span>
    </div>

    <div class="cam-controls">
      <button class="snap-btn" onclick="takePhoto()">📷 Photo</button>
      <div class="shutter-btn" id="record-btn" onclick="toggleRecording()">
        <div class="shutter-inner"></div>
      </div>
    </div>
  </div>

  <script>
    let stream, mediaRecorder, recordedChunks = [];
    let isRecording = false, timerInterval, seconds = 0;

    async function startCam() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: true
        });
      } catch (err) {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" },
            audio: true
          });
        } catch (e) {
          document.getElementById('timer-label').innerText = "Camera Access Blocked";
          return;
        }
      }
      document.getElementById('cam-preview').srcObject = stream;
    }

    function toggleRecording() {
      if (!isRecording) { startRecording(); } 
      else { stopRecording(); }
    }

    function startRecording() {
      recordedChunks = [];
      try {
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = saveVideo;

      mediaRecorder.start();
      isRecording = true;
      document.getElementById('record-btn').classList.add('recording');
      document.getElementById('rec-indicator').classList.add('active');

      seconds = 0;
      timerInterval = setInterval(() => {
        seconds++;
        const mins = String(Math.floor(seconds / 60)).padStart(2, '0');
        const secs = String(seconds % 60).padStart(2, '0');
        document.getElementById('timer-label').innerText = \`REC \${mins}:\${secs}\`;
      }, 1000);
    }

    function stopRecording() {
      mediaRecorder.stop();
      isRecording = false;
      clearInterval(timerInterval);
      document.getElementById('record-btn').classList.remove('recording');
      document.getElementById('rec-indicator').classList.remove('active');
      document.getElementById('timer-label').innerText = "Saving Video...";
    }

    async function saveVideo() {
      const blob = new Blob(recordedChunks, { type: "video/mp4" });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = \`AR_Video_\${Date.now()}.mp4\`;
      a.click();
      document.getElementById('timer-label').innerText = "Saved to Gallery";
    }

    function takePhoto() {
      const video = document.getElementById('cam-preview');
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = \`AR_Photo_\${Date.now()}.png\`;
      a.click();
    }

    window.onload = startCam;
  <\/script>
</body>
</html>`;

    // System Apps Config
    let defaultApps = [
      { name: "JewTube", icon: "📺", type: "code", content: jewtubeCode },
      { name: "AR Maps", icon: "🗺️", type: "code", content: mapsCode },
      { name: "Camera", icon: "📷", type: "code", content: cameraAppCode },
      { name: "WhatsApp", icon: "💬", type: "scheme", scheme: "whatsapp://send" },
      { name: "Messages", icon: "💬", type: "scheme", scheme: "sms:" }
    ];

    let customApps = JSON.parse(localStorage.getItem("ar_custom_apps") || "[]");

    function getApps() {
      return [...defaultApps, ...customApps];
    }

    function renderAppGrid() {
      const grid = document.getElementById('app-grid');
      const apps = getApps();

      grid.innerHTML = apps.map((app, index) => {
        return `
          <div class="app-icon" onclick="launchApp(${index})">
            <div class="icon-box">${app.icon || '📱'}</div>
            <span class="app-label">${app.name}</span>
          </div>
        `;
      }).join('');
    }

    function launchApp(index) {
      const apps = getApps();
      const app = apps[index];

      if (app.type === "scheme") {
        openExternalMessenger(app.scheme, app.name);
        return;
      }

      const frame = document.getElementById('app-frame');
      
      if (app.type === "code") {
        frame.srcdoc = app.content;
      } else if (app.url) {
        frame.removeAttribute('srcdoc');
        frame.src = app.url;
      }

      document.getElementById('grid-container').style.display = 'none';
      document.getElementById('app-window').style.display = 'block';
      document.getElementById('add-btn').style.display = 'none';
      document.getElementById('undo-btn').style.display = 'inline-block';
      document.getElementById('island-status').innerText = app.name;
    }

    function closeApp() {
      const frame = document.getElementById('app-frame');
      frame.src = 'about:blank';
      frame.removeAttribute('srcdoc');

      document.getElementById('grid-container').style.display = 'block';
      document.getElementById('app-window').style.display = 'none';
      document.getElementById('add-btn').style.display = 'inline-block';
      document.getElementById('undo-btn').style.display = 'none';
      document.getElementById('island-status').innerText = 'AR Glasses OS';
    }

    function openModal() {
      document.getElementById('add-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('add-modal').style.display = 'none';
      document.getElementById('app-name').value = '';
      document.getElementById('app-url').value = '';
    }

    function saveApp() {
      const name = document.getElementById('app-name').value.trim();
      const url = document.getElementById('app-url').value.trim();

      if (!name || !url) {
        alert("Please provide both a name and a URL.");
        return;
      }

      customApps.push({ name, url, icon: '🌐', type: 'url' });
      localStorage.setItem("ar_custom_apps", JSON.stringify(customApps));
      closeModal();
      renderAppGrid();
    }

    async function initBackgroundCamera() {
      const video = document.getElementById('camera-feed');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = fallbackStream;
        } catch (e) {
          console.warn("Background camera passthrough unavailable.");
        }
      }
    }

    window.onload = function() {
      renderAppGrid();
      initBackgroundCamera();

      if ("Notification" in window && Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
      }
    };
  </script>
</body>
</html>
