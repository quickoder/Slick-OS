<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Glasses OS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #000;
      color: white;
    }

    /* Live Camera Background Passthrough */
    #camera-feed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* 70% Viewport Container (Lens Safe Zone) */
    .vr-safe-zone {
      position: relative;
      z-index: 2;
      width: 70vw;
      height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px 10px;
    }

    /* Dynamic Island Top Bar */
    .dynamic-island {
      position: relative;
      z-index: 100;
      background: rgba(15, 15, 20, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      margin-bottom: 15px;
    }

    .island-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }

    .action-btn:active {
      background: rgba(255, 255, 255, 0.5);
    }

    #undo-btn { display: none; }

    /* App Grid Container */
    .app-grid-container {
      width: 100%;
      max-height: 75vh;
      overflow-y: auto;
      scrollbar-width: none;
    }
    .app-grid-container::-webkit-scrollbar { display: none; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px 15px;
      width: 100%;
      padding: 10px 0;
    }

    .app-icon {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .app-icon:active {
      transform: scale(0.92);
    }

    .icon-box {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 1px rgba(255,255,255,0.3);
      overflow: hidden;
    }

    .icon-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 2px;
    }

    .app-label {
      font-size: 11px;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      text-align: center;
      max-width: 70px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Active Window Overlay */
    .app-window {
      width: 100%;
      height: 75vh;
      background: rgba(15, 15, 20, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      overflow: hidden;
      display: none;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Add Custom App Modal */
    .modal {
      position: absolute;
      top: 90px;
      width: 100%;
      background: rgba(20, 20, 30, 0.95);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 24px;
      padding: 20px;
      display: none;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      z-index: 110;
    }

    .modal h3 { font-size: 16px; text-align: center; }

    .modal input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(0, 0, 0, 0.5);
      color: white;
      font-size: 13px;
      outline: none;
    }

    .modal-buttons { display: flex; gap: 10px; margin-top: 5px; }

    .modal-buttons button {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-submit { background: #34c759; color: white; }
    .btn-cancel { background: #ff3b30; color: white; }
  </style>
</head>

            body: bodyText || "Tap here to instantly jump back to your AR Glasses OS.",

          notif.onclick = function() {
            window.focus();
            this.close();
          };
        } else if (Notification.permission !== "denied") {
          Notification.requestPermission();

          if (searchMarker) map.removeLayer(searchMarker);
          searchMarker = L.marker([destLat, destLng]).addTo(map).bindPopup(data[0].display_name).openPopup();

          await getTurnByTurnRoute(defaultLat, defaultLng, destLat, destLng, data[0].display_name.split(',')[0]);
        }
      } catch (err) { console.error("Navigation error", err); }
    }

    async function getTurnByTurnRoute(startLat, startLng, endLat, endLng, destinationName) {
      const url = \`https://router.project-osrm.org/route/v1/driving/\${startLng},\${startLat};\${endLng},\${endLat}?steps=true&geometries=geojson\`;
      try {
        const res = await fetch(url);
        const routeData = await res.json();

        if (routeData.routes && routeData.routes.length > 0) {
          const route = routeData.routes[0];
          
          if (routeLine) map.removeLayer(routeLine);
          const coordinates = route.geometry.coordinates.map(c => [c[1], c[0]]);
          routeLine = L.polyline(coordinates, { color: '#34c759', weight: 5, opacity: 0.9 }).addTo(map);
          map.fitBounds(routeLine.getBounds(), { padding: [40, 40] });

          navSteps = [];
          route.legs[0].steps.forEach(s => {
            navSteps.push({
              instruction: s.maneuver.type === 'arrive' ? \`Arrived at \${destinationName}\` : (s.name ? \`Turn onto \${s.name}\` : 'Head towards destination'),
              type: s.maneuver.type,
              modifier: s.maneuver.modifier,
              distance: Math.round(s.distance * 3.28084),
              duration: Math.round(route.duration / 60)
            });
          });

          currentStepIdx = 0;
          showStepInHUD(destinationName);
        }
      } catch (e) {
        navSteps = [{ instruction: \`Heading to \${destinationName}\`, type: 'straight', distance: 500, duration: 5 }];
        currentStepIdx = 0;
        showStepInHUD(destinationName);
      }
    }

    function showStepInHUD(destName) {
      if (navSteps.length === 0) return;
      const step = navSteps[currentStepIdx];
      
      let icon = '⬆️';
      if (step.modifier?.includes('right')) icon = '↗️';
      else if (step.modifier?.includes('left')) icon = '↖️';
      else if (step.type === 'arrive') icon = '📍';

      document.getElementById('hud-turn-icon').innerText = icon;
      document.getElementById('hud-instruction').innerText = step.instruction;
      document.getElementById('hud-sub').innerText = step.type === 'arrive' ? 'Destination Reached' : \`In \${step.distance} ft • \${step.duration} min to \${destName}\`;
      
      document.getElementById('meta-nav-card').classList.add('active');
    }

    function nextStep() {
      currentStepIdx++;
      if (currentStepIdx < navSteps.length) { showStepInHUD('Destination'); } 
      else { cancelNav(); }
    }

    function cancelNav() {
      document.getElementById('meta-nav-card').classList.remove('active');
      if (routeLine) map.removeLayer(routeLine);
      if (searchMarker) map.removeLayer(searchMarker);
    }

    window.onload = initMap;
  <\/script>
</body>
</html>`;

      maps: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='bg' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%2311998e'/><stop offset='100%25' stop-color='%2338ef7d'/></linearGradient><filter id='shadow' x='-20%25' y='-20%25' width='140%25' height='140%25'><feDropShadow dx='0' dy='6' stdDeviation='6' flood-color='%23000' flood-opacity='0.4'/></filter></defs><rect x='10' y='10' width='80' height='80' rx='24' fill='url(%23bg)' filter='url(%23shadow)'/><path d='M25 30 L40 24 L60 30 L75 24 V68 L60 74 L40 68 L25 74 Z' fill='%23ffffff' opacity='0.85'/><path d='M40 24 V68' stroke='%2338ef7d' stroke-width='3'/><path d='M60 30 V74' stroke='%2311998e' stroke-width='3'/><path d='M50 32 C43 32 38 37 38 44 C38 53 50 64 50 64 C50 64 62 53 62 44 C62 37 57 32 50 32 Z' fill='%23ff3b30' filter='url(%23shadow)'/><circle cx='50' cy='42' r='4' fill='%23ffffff'/></svg>",

    };

    // System Apps Configuration
    const defaultApps = [
      { name: 'Phone', url: 'internal:phone', imgUrl: icons3D.phone },
      { name: 'Messages', url: 'internal:messages', imgUrl: icons3D.messages },
      { name: 'Camera', url: 'internal:camera', imgUrl: icons3D.camera },
      { name: 'Maps', url: 'internal:maps', imgUrl: icons3D.maps },
      { name: 'JewTube', url: 'internal:jewtube', imgUrl: icons3D.jewtube },
      { name: 'WhatsApp', url: 'internal:whatsapp', imgUrl: icons3D.whatsapp },
      { name: 'AR AI', url: 'internal:ai', imgUrl: icons3D.ai }
    ];

    let userApps = JSON.parse(localStorage.getItem('ar_apps_v3')) || defaultApps;

    // Start Live AR Camera Passthrough
    async function initCamera() {
      const video = document.getElementById('camera-feed');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = fallbackStream;
        } catch (e) { console.warn("Camera passthrough permission denied"); }
      }
    }

    // Render Grid Apps
    function renderApps() {
      const grid = document.getElementById('app-grid');
      grid.innerHTML = userApps.map((app, index) => `
        <div class="app-icon" onclick="launchApp(${index})">
          <div class="icon-box">
            <img src="${app.imgUrl}" alt="${app.name}">
          </div>
          <span class="app-label">${app.name}</span>
        </div>
      `).join('');
    }

    // App Launcher
    function launchApp(index) {
      const app = userApps[index];
      const frame = document.getElementById('app-frame');
      
      if (app.url === 'internal:jewtube') {
        frame.srcdoc = jewtubeCode;
      } else if (app.url === 'internal:maps') {
        frame.srcdoc = mapsCode;
      } else if (app.url === 'internal:camera') {
        frame.srcdoc = cameraAppCode;
      } else if (app.url === 'internal:phone') {
        frame.srcdoc = phoneAppCode;
      } else if (app.url === 'internal:messages') {
        frame.srcdoc = messagesAppCode;
      } else if (app.url === 'internal:whatsapp') {
        frame.srcdoc = whatsappAppCode;
      } else if (app.url === 'internal:ai') {
        frame.srcdoc = aiAssistantCode;
      } else {
        frame.srcdoc = '';
        frame.src = app.url;
      }

      document.querySelector('.app-grid-container').style.display = 'none';
      document.getElementById('app-window').style.display = 'block';
      document.getElementById('add-btn').style.display = 'none';
      document.getElementById('undo-btn').style.display = 'block';
      document.getElementById('island-status').innerText = app.name;
    }

    // Close Active App
    function closeApp() {
      const frame = document.getElementById('app-frame');
      frame.src = 'about:blank';
      frame.srcdoc = '';
      document.getElementById('app-window').style.display = 'none';
      document.querySelector('.app-grid-container').style.display = 'block';
      document.getElementById('add-btn').style.display = 'block';
      document.getElementById('undo-btn').style.display = 'none';
      document.getElementById('island-status').innerText = 'AR Glasses OS';
    }

    // Modal Helpers
    function openModal() { document.getElementById('add-modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('add-modal').style.display = 'none'; }

    function saveApp() {
      const name = document.getElementById('app-name').value.trim();
      const url = document.getElementById('app-url').value.trim();

      if (!name || !url) {
        alert("Please provide both a name and a URL!");
        return;
      }

      userApps.push({
        name: name,
        url: url,
        imgUrl: icons3D.ai
      });

      localStorage.setItem('ar_apps_v3', JSON.stringify(userApps));
      renderApps();
      closeModal();
      document.getElementById('app-name').value = '';
      document.getElementById('app-url').value = '';
    }

    window.onload = () => {
      initCamera();
      renderApps();
      if ("Notification" in window && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    };
  </script>
